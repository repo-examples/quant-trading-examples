[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "Information-Theoretic Technical Indicator Research CLI & Interactive Dashboard with a SymPy-to-Pine Script v6 Transpiler"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "QuantLab Research" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "sympy>=1.12",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "numba>=0.59.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "yfinance>=0.2.38",
    "ccxt>=4.2.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "lightweight-charts>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
